name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  # Lets a maintainer re-run the checks by hand from the Actions tab.
  workflow_dispatch:

jobs:
  lint-and-test:
    name: PHP ${{ matrix.php }} / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.1', '8.3']
        wp: ['6.2', 'latest']

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, sodium, zip, curl, mbstring
          coverage: none

      - name: Lint every PHP file
        run: |
          find . -name '*.php' -not -path './vendor/*' -print0 \
            | xargs -0 -n1 php -l

      - name: Install WordPress
        run: |
          if [ "${{ matrix.wp }}" = "latest" ]; then
            WP_VERSION="$(curl -sS https://api.wordpress.org/core/version-check/1.7/ | php -r 'echo json_decode(stream_get_contents(STDIN))->offers[0]->current;')"
          else
            WP_VERSION="${{ matrix.wp }}"
          fi
          # WordPress unpacks to ./wordpress. The workspace itself is the plugin,
          # so it is copied in afterwards (never as part of the unpack: copying
          # "." into a subdirectory of itself recurses forever).
          curl -sSL "https://wordpress.org/wordpress-${WP_VERSION}.tar.gz" | tar xz
          mkdir -p wordpress/wp-content/plugins
          rsync -a --exclude .git --exclude wordpress ./ wordpress/wp-content/plugins/githubsync/

      - name: Configure WordPress
        working-directory: wordpress
        run: |
          cp wp-config-sample.php wp-config.php
          sed -i "s/database_name_here/wordpress/;s/username_here/root/;s/password_here/root/;s/localhost/127.0.0.1/" wp-config.php
          curl -sSL -o /tmp/wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          php /tmp/wp-cli.phar core install \
            --url=http://localhost --title=CI --admin_user=admin \
            --admin_password=admin --admin_email=admin@example.com --skip-email
          php /tmp/wp-cli.phar plugin activate githubsync

      - name: Create an encryption key
        # The security suite asserts the real key file: exists, 0600, outside
        # ABSPATH. WordPress lives in wordpress/, so the default path is the
        # parent directory of the workspace subfolder.
        run: |
          php -r 'file_put_contents($argv[1], base64_encode(random_bytes(32)) . "\n"); chmod($argv[1], 0600);' \
            "${{ github.workspace }}/githubsync-secret.key"

      - name: Build the release archive
        run: ./build.sh

      - name: Run the test suite
        env:
          GITHUBSYNC_WP_ROOT: ${{ github.workspace }}/wordpress
          GITHUBSYNC_PLUGIN_DIR: ${{ github.workspace }}/wordpress/wp-content/plugins/githubsync
        run: php tests/run-tests.php

  # Publishing a release is what makes self-updates possible. WordPress
  # downloads packages without credentials, so the assets are mirrored to the
  # separate public digal2025/githubsync-releases repository. That release also
  # carries update.json, the manifest installed sites read from:
  #
  #   https://github.com/digal2025/githubsync-releases/releases/latest/download/update.json
  release:
    name: Publish release and update manifest
    needs: lint-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RELEASES_REPO: digal2025/githubsync-releases
      RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - name: Check the release token is configured
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "The RELEASES_TOKEN secret is not set; it must be a token with write access to ${RELEASES_REPO}." >&2
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Build the release archive
        run: ./build.sh "${GITHUB_REF_NAME#v}"

      - name: Check the tag matches the plugin version
        run: |
          HEADER="$(sed -n 's/^ \* Version: *\(.*\)$/\1/p' githubsync.php | head -1)"
          if [ "$HEADER" != "${GITHUB_REF_NAME#v}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the plugin version ${HEADER}" >&2
            exit 1
          fi

      - name: Publish to the public releases repository
        env:
          GH_TOKEN: ${{ env.RELEASES_TOKEN }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          TAG="$GITHUB_REF_NAME"
          BODY_FILE="$(mktemp)"
          awk -v v="${TAG#v}" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && index($0, "## [") == 1 { exit }
            on { print }
          ' CHANGELOG.md > "$BODY_FILE"
          printf '\nSource: %s/tree/%s\n' "$GITHUB_SERVER_URL/$SOURCE_REPO" "$TAG" >> "$BODY_FILE"

          if gh release view "$TAG" --repo "$RELEASES_REPO" >/dev/null 2>&1; then
            gh release edit "$TAG" --repo "$RELEASES_REPO" --notes-file "$BODY_FILE" --draft=false
          else
            gh release create "$TAG" --repo "$RELEASES_REPO" \
              --title "GitHubSync ${TAG#v}" --notes-file "$BODY_FILE"
          fi

          gh release upload "$TAG" --repo "$RELEASES_REPO" --clobber dist/githubsync.zip

          SHA="$(gh release view "$TAG" --repo "$RELEASES_REPO" \
            --json assets --jq '.assets[] | select(.name == "githubsync.zip") | .digest')"
          if [ -z "$SHA" ] || [ "$SHA" = "null" ]; then
            SHA="sha256:$(shasum -a 256 dist/githubsync.zip | awk '{print $1}')"
          fi

          GITHUB_REPOSITORY="$RELEASES_REPO" \
          GITHUB_SERVER_URL="$GITHUB_SERVER_URL" \
          GITHUBSYNC_SHA256="$SHA" \
          GITHUBSYNC_SOURCE_REPO="$SOURCE_REPO" \
          GITHUBSYNC_SOURCE_TAG="$TAG" \
            php .github/scripts/write-manifest.php dist/githubsync.zip dist/update.json

          gh release upload "$TAG" --repo "$RELEASES_REPO" --clobber dist/update.json

      - name: Verify the manifest is publicly readable
        run: |
          MANIFEST="https://github.com/${RELEASES_REPO}/releases/latest/download/update.json"
          LATEST_ZIP="https://github.com/${RELEASES_REPO}/releases/latest/download/githubsync.zip"
          VERSIONED_ZIP="https://github.com/${RELEASES_REPO}/releases/download/${GITHUB_REF_NAME}/githubsync.zip"
          VERSION="${GITHUB_REF_NAME#v}"

          for attempt in 1 2 3 4 5; do
            STATUS="$(curl -sS -o /tmp/update.json -w '%{http_code}' -L "$MANIFEST" || true)"
            [ "$STATUS" = "200" ] && break
            echo "Attempt ${attempt}: manifest HTTP ${STATUS}; retrying…"
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "The manifest is not reachable anonymously (HTTP ${STATUS})." >&2
            exit 1
          fi

          LATEST_STATUS="$(curl -sS -o /dev/null -r 0-0 -w '%{http_code}' -L "$LATEST_ZIP")"
          if [ "$LATEST_STATUS" != "200" ] && [ "$LATEST_STATUS" != "206" ]; then
            echo "The latest release zip is not reachable anonymously (HTTP ${LATEST_STATUS})." >&2
            exit 1
          fi

          VERSIONED_STATUS="$(curl -sS -o /dev/null -r 0-0 -w '%{http_code}' -L "$VERSIONED_ZIP")"
          if [ "$VERSIONED_STATUS" != "200" ] && [ "$VERSIONED_STATUS" != "206" ]; then
            echo "The versioned release zip is not reachable anonymously (HTTP ${VERSIONED_STATUS})." >&2
            exit 1
          fi

          php -r '
            $m = json_decode(file_get_contents("/tmp/update.json"), true);
            $ok = is_array($m)
              && ($m["version"] ?? "") === $argv[2]
              && ($m["download_url"] ?? "") === $argv[1];
            if (!$ok) { fwrite(STDERR, "Manifest does not match this release.\n"); exit(1); }
            echo "Manifest points at the verified versioned zip.\n";
          ' "$VERSIONED_ZIP" "$VERSION"
